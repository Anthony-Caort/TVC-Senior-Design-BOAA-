<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint Planner</title>
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #mapWrap { flex: 1; position: relative; }
  #map { position: absolute; inset: 0; }

  /* Telemetry boxes (base GPS, rover), stacked over the top-left of the map */
  #telem { position: absolute; top: 10px; left: 54px; z-index: 1000; width: 230px;
           display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .tbox { background: rgba(10, 14, 20, 0.88); color: #e5e7eb; border: 1px solid #334155; border-radius: 6px;
          padding: 8px 10px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .tbox-head { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 1px; color: #94a3b8;
               border-bottom: 1px solid #334155; padding-bottom: 5px; margin-bottom: 5px; }
  .tbox-head .state { margin-left: auto; font-weight: bold; }
  .tbox-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
  .tbox-grid { display: grid; grid-template-columns: 44px 1fr; row-gap: 2px; }
  .tbox-grid .k { color: #64748b; }
  .tbox-grid .v { text-align: right; font-size: 15px; color: #f8fafc; font-variant-numeric: tabular-nums; }
  #roverBox .tbox-head .name { color: #22d3ee; }

  /* Map markers for the base (green square, antenna) and rover (cyan circle, rover):
     icon + pulse ring while live, gray at the last known spot when stale */
  .live-icon { position: relative; width: 28px; height: 28px; --c: #22c55e; --r: 6px; }
  .live-icon.rover { --c: #22d3ee; --r: 50%; }
  .live-icon .core { position: absolute; inset: 0; box-sizing: border-box; background: #0a0e14; color: var(--c);
                     border: 2px solid var(--c); border-radius: var(--r); box-shadow: 0 0 4px #000;
                     display: flex; align-items: center; justify-content: center; }
  .live-icon .pulse { position: absolute; inset: 0; border: 2px solid var(--c); border-radius: var(--r);
                      animation: livePulse 1.8s ease-out infinite; }
  .live-icon.stale .core { color: #94a3b8; border-color: #64748b; }
  .live-icon.stale .pulse { display: none; }
  @keyframes livePulse { from { transform: scale(1); opacity: 0.8; } to { transform: scale(2.2); opacity: 0; } }

  #panel { width: 300px; padding: 12px; box-sizing: border-box; overflow-y: auto; background: #f4f4f6; border-left: 1px solid #ccc; }
  button { display: block; width: 100%; margin: 4px 0; padding: 8px; font-size: 14px; cursor: pointer; }
  button.active { background: #2563eb; color: #fff; }
  textarea { width: 100%; height: 200px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
  #status { font-size: 13px; margin: 8px 0; min-height: 3em; }
  .wp-icon { background: #2563eb; color: #fff; border-radius: 50%; width: 24px; height: 24px; line-height: 24px; text-align: center; font-weight: bold; border: 2px solid #fff; box-shadow: 0 0 3px #000; }
  .wp-icon.bad { background: #dc2626; }
  h3 { margin: 12px 0 4px; }
  button.connected { background: #16a34a; color: #fff; }
  #espLog { height: 120px; }

  /* Phones (WiFi mode): map on top, panel underneath instead of a sidebar. Keep this LAST so it overrides the rules above */
  @media (max-width: 700px) {
    #app { flex-direction: column; }
    #mapWrap { flex: none; height: 60vh; }
    #panel { width: 100%; flex: 1; border-left: none; border-top: 1px solid #ccc; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <div id="map"></div>
    <div id="telem">
      <div id="gpsBox" class="tbox">
        <div class="tbox-head"><span id="gpsDot" class="tbox-dot"></span><span class="name">BASE GPS</span><span id="gpsState" class="state">NO LINK</span></div>
        <div class="tbox-grid">
          <span class="k">LAT</span>  <span id="gpsLat"  class="v">--</span>
          <span class="k">LON</span>  <span id="gpsLon"  class="v">--</span>
          <span class="k">SATS</span> <span id="gpsSats" class="v">--</span>
          <span class="k">HDOP</span> <span id="gpsHdop" class="v">--</span>
        </div>
      </div>
      <div id="roverBox" class="tbox">
        <div class="tbox-head"><span id="rovDot" class="tbox-dot"></span><span class="name">ROVER</span><span id="rovState" class="state">NO LINK</span></div>
        <div class="tbox-grid">
          <span class="k">LAT</span>  <span id="rovLat"  class="v">--</span>
          <span class="k">LON</span>  <span id="rovLon"  class="v">--</span>
          <span class="k">SATS</span> <span id="rovSats" class="v">--</span>
          <span class="k">HDOP</span> <span id="rovHdop" class="v">--</span>
        </div>
      </div>
    </div>
  </div>
  <div id="panel">
    <h3>Mode</h3>
    <button id="btnWp" class="active">Add waypoints</button>
    <button id="btnBd">Draw boundary</button>
    <button id="btnClose">Close boundary</button>
    <h3>Edit</h3>
    <button id="btnUndo">Undo last point</button>
    <button id="btnClear">Clear all</button>
    <button id="btnLoc">Center on my location</button>
    <h3>Export</h3>
    <button id="btnCopy">Copy JSON</button>
    <button id="btnDl">Download mission.json</button>
    <h3 id="bsTitle">Base station (USB)</h3>
    <button id="btnConn">Connect (USB)</button>
    <button id="btnSend">Send mission</button>
    <textarea id="espLog" readonly placeholder="Messages from the base station show up here"></textarea>
    <div id="status"></div>
    <textarea id="out" readonly></textarea>
    <p style="font-size:12px;color:#555">Waypoints are draggable. A red waypoint is outside the boundary.</p>
  </div>
</div>

<script src="lib/leaflet/leaflet.js"></script>
<script src="config.js"></script>
<script>
// ---------- Config (config.js: laptop = usb, ESP32-served copy = wifi) ----------
const CFG = Object.assign({ transport: 'usb', maxNativeZoom: 18, tileBounds: null }, window.UI_CONFIG);
const WIFI = CFG.transport === 'wifi';

// ---------- Map + tile layers ----------
const FIELD_CENTER = [33.973344828295104, -117.32819390408356]; // test field center
// minZoom 15 = lowest zoom we exported tiles for. maxBounds keeps the view on the area we have tiles for
// (viscosity 1 = hard wall, no rubber-banding), so the ESP32 isn't asked for tiles it doesn't have.
const map = L.map('map', {
  minZoom: 15,
  maxBounds: CFG.tileBounds || undefined,
  maxBoundsViscosity: 1.0
}).setView(FIELD_CENTER, 17);

// Offline tiles exported from QGIS (USGS NAIP imagery), stored in UI/tiles/{z}/{x}/{y}.jpg
const local = L.tileLayer('tiles/{z}/{x}/{y}.jpg', {
  minZoom: 15, maxZoom: 21,
  maxNativeZoom: CFG.maxNativeZoom,   // past this zoom, stretch the last tiles instead of showing blank (laptop 18, ESP32 17)
  bounds: CFG.tileBounds || undefined, // never request tiles outside this box (each would be a 404)
  attribution: 'Imagery: USGS NAIP'
});

// Online layers, only work with internet. Kept as extras in the layer picker.
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
});
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Tiles &copy; Esri'
});
local.addTo(map);
L.control.layers({ 'Offline (field)': local, 'Satellite (Esri, online)': sat, 'Street (OSM, online)': osm }).addTo(map);
L.control.scale({ imperial: false }).addTo(map);

// ---------- State ----------
let mode = 'waypoint';        // 'waypoint' | 'boundary'
let waypoints = [];           // [{lat, lng, marker}]
let boundary = [];            // [[lat, lng], ...]
let boundaryClosed = false;
const wpLine = L.polyline([], { color: '#2563eb', weight: 3 }).addTo(map);
let bdShape = null;
const bdVertices = L.layerGroup().addTo(map);

// ---------- Geometry ----------
// Ray casting point-in-polygon. Points are [lng, lat] so x = lng, y = lat.
function pointInPolygon(lat, lng, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [yi, xi] = poly[i], [yj, xj] = poly[j];
    if ((yi > lat) !== (yj > lat) &&
        lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// ---------- Rendering ----------
function iconFor(n, bad) {
  return L.divIcon({ className: '', html: `<div class="wp-icon ${bad ? 'bad' : ''}">${n}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
}

function redraw() {
  // boundary
  if (bdShape) { map.removeLayer(bdShape); bdShape = null; }
  bdVertices.clearLayers();
  if (boundary.length >= 2) {
    bdShape = boundaryClosed
      ? L.polygon(boundary, { color: '#16a34a', weight: 2, fillOpacity: 0.1 })
      : L.polyline(boundary, { color: '#16a34a', weight: 2, dashArray: '6 6' });
    bdShape.addTo(map);
  }
  boundary.forEach(p => L.circleMarker(p, { radius: 4, color: '#16a34a', fillOpacity: 1 }).addTo(bdVertices));

  // waypoints
  let outside = 0;
  waypoints.forEach((w, i) => {
    const bad = boundaryClosed && !pointInPolygon(w.lat, w.lng, boundary);
    if (bad) outside++;
    w.marker.setIcon(iconFor(i + 1, bad));
  });
  wpLine.setLatLngs(waypoints.map(w => [w.lat, w.lng]));

  // status + export
  const s = [];
  s.push(`${waypoints.length} waypoint(s)`);
  s.push(boundaryClosed ? `boundary closed (${boundary.length} vertices)` : `boundary: ${boundary.length} vertices (not closed)`);
  if (outside) s.push(`<b style="color:#dc2626">${outside} waypoint(s) outside boundary</b>`);
  document.getElementById('status').innerHTML = s.join('<br>');
  document.getElementById('out').value = JSON.stringify(exportData(), null, 2);
}

function exportData() {
  return {
    waypoints: waypoints.map((w, i) => ({ id: i + 1, lat: +w.lat.toFixed(7), lon: +w.lng.toFixed(7) })),
    boundary: boundaryClosed ? boundary.map(p => ({ lat: +p[0].toFixed(7), lon: +p[1].toFixed(7) })) : []
  };
}

// ---------- Actions ----------
function addWaypoint(latlng) {
  const marker = L.marker(latlng, { draggable: true, icon: iconFor(waypoints.length + 1, false) }).addTo(map);
  const w = { lat: latlng.lat, lng: latlng.lng, marker };
  marker.on('drag', e => { w.lat = e.latlng.lat; w.lng = e.latlng.lng; redraw(); });
  marker.on('contextmenu', () => { // right-click deletes
    map.removeLayer(marker);
    waypoints = waypoints.filter(x => x !== w);
    redraw();
  });
  waypoints.push(w);
  redraw();
}

map.on('click', e => {
  if (mode === 'waypoint') addWaypoint(e.latlng);
  else if (!boundaryClosed) { boundary.push([e.latlng.lat, e.latlng.lng]); redraw(); }
});

function setMode(m) {
  mode = m;
  document.getElementById('btnWp').classList.toggle('active', m === 'waypoint');
  document.getElementById('btnBd').classList.toggle('active', m === 'boundary');
}
document.getElementById('btnWp').onclick = () => setMode('waypoint');
document.getElementById('btnBd').onclick = () => { if (boundaryClosed) { boundaryClosed = false; } setMode('boundary'); redraw(); };
document.getElementById('btnClose').onclick = () => {
  if (boundary.length < 3) { alert('Need at least 3 vertices.'); return; }
  boundaryClosed = true; setMode('waypoint'); redraw();
};
document.getElementById('btnUndo').onclick = () => {
  if (mode === 'waypoint' && waypoints.length) { map.removeLayer(waypoints.pop().marker); }
  else if (mode === 'boundary' && boundary.length) { boundary.pop(); boundaryClosed = false; }
  redraw();
};
document.getElementById('btnClear').onclick = () => {
  waypoints.forEach(w => map.removeLayer(w.marker));
  waypoints = []; boundary = []; boundaryClosed = false; redraw();
};
document.getElementById('btnLoc').onclick = locate;
document.getElementById('btnCopy').onclick = () => {
  const out = document.getElementById('out');
  // navigator.clipboard only exists on https/localhost, not on http://192.168.4.1 -> fall back to the old copy command
  if (navigator.clipboard) { navigator.clipboard.writeText(out.value); return; }
  out.select();
  document.execCommand('copy');
};
document.getElementById('btnDl').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([document.getElementById('out').value], { type: 'application/json' }));
  a.download = 'mission.json'; a.click();
};

function locate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    p => map.setView([p.coords.latitude, p.coords.longitude], 18),
    () => alert('Location unavailable. Pan/zoom the map manually.')
  );
}

// ---------- USB serial to base station (Web Serial, Chrome/Edge only) ----------
let port = null, writer = null, reader = null, readableClosed = null;
const espLog = document.getElementById('espLog');
const btnConn = document.getElementById('btnConn');

// Add one line to the log box, keep only the last 50 lines
function logLine(text) {
  const lines = (espLog.value ? espLog.value.split('\n') : []).concat(text).slice(-50);
  espLog.value = lines.join('\n');
  espLog.scrollTop = espLog.scrollHeight;
}

let setConnected = function (on) {   // let: WiFi mode swaps in its own version below
  btnConn.textContent = on ? 'Connected (click to disconnect)' : 'Connect (USB)';
  btnConn.classList.toggle('connected', on);
};

async function connect() {
  if (!('serial' in navigator)) { alert('Web Serial not available. Use Chrome or Edge, opened from http://localhost.'); return; }
  try {
    port = await navigator.serial.requestPort();      // browser pops up a COM port picker
    await port.open({ baudRate: 115200 });            // must match Serial.begin() on the ESP32
  } catch (e) {
    port = null;
    alert('Could not open port: ' + e.message + '\n(Is the PlatformIO serial monitor still open?)');
    return;
  }
  writer = port.writable.getWriter();
  setConnected(true);
  logLine('--- connected ---');
  readLoop();
}

async function disconnect() {
  // Order matters: stop reading, release the writer, then close the port
  try { if (reader) { await reader.cancel(); } } catch (e) {}
  try { if (readableClosed) { await readableClosed; } } catch (e) {}
  try { if (writer) { writer.releaseLock(); } } catch (e) {}
  try { if (port) { await port.close(); } } catch (e) {}
  port = null; writer = null; reader = null; readableClosed = null;
  resetFeeds();
  setConnected(false);
  logLine('--- disconnected ---');
}

// Read text from the ESP32 and split it into lines (data can arrive in random-sized chunks)
async function readLoop() {
  const decoder = new TextDecoderStream();
  readableClosed = port.readable.pipeTo(decoder.writable).catch(() => {});
  reader = decoder.readable.getReader();
  let buffer = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      let nl;
      while ((nl = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, nl).replace(/\r$/, '');
        buffer = buffer.slice(nl + 1);
        if (line) handleEspLine(line);
      }
    }
  } catch (e) {
    logLine('--- read error: ' + e.message + ' ---');
  }
}

// ---------- Telemetry boxes ----------
// The base station sends one "GPS,..." line (its own GPS) and one "ROVER,..." line (rover telemetry it received) per second:
//   GPS,NODATA | GPS,NOFIX,<sats> | GPS,FIX,<lat>,<lon>,<sats>,<hdop>
//   ROVER,NOLINK | ROVER,NODATA | ROVER,NOFIX,<sats> | ROVER,FIX,<lat>,<lon>,<sats>,<hdop>
// (ROVER,NOLINK = base station hasn't heard from the rover recently.) Anything else goes to the log.
const STATE_COLORS = { FIX: '#22c55e', NOFIX: '#f59e0b', NODATA: '#ef4444', STALE: '#64748b', 'NO LINK': '#64748b' };

// prefix = id prefix of the box elements ('gps' or 'rov')
function setBox(prefix, state, lat = '--', lon = '--', sats = '--', hdop = '--') {
  const el = id => document.getElementById(prefix + id);
  el('State').textContent = state;
  el('State').style.color = STATE_COLORS[state];
  el('Dot').style.background = STATE_COLORS[state];
  el('Lat').textContent = lat;
  el('Lon').textContent = lon;
  el('Sats').textContent = sats;
  el('Hdop').textContent = hdop;
}

// ---------- Base station + rover markers on the map ----------
// Each shows up on its first FIX. Colored + pulsing while live, gray at the last known spot when fix/link is lost.
const ANTENNA_SVG = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
  <path d="M12 13v8"/><path d="M8 21h8"/><circle cx="12" cy="11" r="2"/>
  <path d="M8.5 7.5a5 5 0 0 0 0 7"/><path d="M15.5 7.5a5 5 0 0 1 0 7"/>
  <path d="M5.5 4.5a9 9 0 0 0 0 13"/><path d="M18.5 4.5a9 9 0 0 1 0 13"/></svg>`;
const ROVER_SVG = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M9 7V4h6v3"/><rect x="3" y="7" width="18" height="8" rx="2"/>
  <circle cx="6.5" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/></svg>`;
const HDOP_TO_METERS = 5;   // rough accuracy estimate: HDOP x ~5 m (typical consumer GPS), only for the circle size

// kind = 'base' | 'rover' (CSS class), color = live color of the accuracy circle, zIndex = rover drawn above base
function makeLiveMarker(kind, svg, color, zIndex) {
  let marker = null;     // the icon
  let accuracy = null;   // faint circle showing rough GPS accuracy
  let live = false;
  const icon = on => L.divIcon({
    className: '',
    html: `<div class="live-icon ${kind} ${on ? '' : 'stale'}"><div class="pulse"></div><div class="core">${svg}</div></div>`,
    iconSize: [28, 28], iconAnchor: [14, 14]
  });
  const self = {
    update(lat, lon, hdop) {
      const pos = [lat, lon];
      const radius = Math.max(hdop * HDOP_TO_METERS, 2);
      if (!marker) {
        // interactive: false -> clicks go through to the map, so waypoints can still be placed next to it
        accuracy = L.circle(pos, { radius, color, weight: 1, fillOpacity: 0.08, interactive: false }).addTo(map);
        marker = L.marker(pos, { icon: icon(true), interactive: false, zIndexOffset: zIndex }).addTo(map);
        live = true;
      } else {
        marker.setLatLng(pos);
        accuracy.setLatLng(pos).setRadius(radius);
      }
      self.setLive(true);
    },
    // Only swap the icon when the state changes, otherwise the pulse animation restarts every second
    setLive(on) {
      if (!marker || live === on) return;
      live = on;
      marker.setIcon(icon(on));
      accuracy.setStyle({ color: on ? color : '#64748b' });
    }
  };
  return self;
}

// One entry per line tag the base station sends. lastMs = when the last line arrived, 0 = none yet
const FEEDS = {
  GPS:   { box: 'gps', marker: makeLiveMarker('base',  ANTENNA_SVG, '#22c55e', -100), lastMs: 0 },
  ROVER: { box: 'rov', marker: makeLiveMarker('rover', ROVER_SVG,   '#22d3ee',  100), lastMs: 0 }
};

function handleEspLine(line) {
  const f = line.split(',');   // f[0] = tag ("GPS" / "ROVER"), f[1] = state
  const feed = FEEDS[f[0]];
  if (!feed) { logLine('ESP: ' + line); return; }
  feed.lastMs = Date.now();
  if (f[1] === 'FIX') {
    setBox(feed.box, 'FIX', (+f[2]).toFixed(6), (+f[3]).toFixed(6), f[4], f[5]);
    feed.marker.update(+f[2], +f[3], +f[5]);
  } else if (f[1] === 'NOFIX') {
    setBox(feed.box, 'NOFIX', '--', '--', f[2]);
    feed.marker.setLive(false);
  } else if (f[1] === 'NOLINK') {
    setBox(feed.box, 'NO LINK');
    feed.marker.setLive(false);
  } else {
    setBox(feed.box, 'NODATA');
    feed.marker.setLive(false);
  }
}

// Link to the base station lost (USB unplugged / WiFi dropped): everything back to NO LINK, markers gray
function resetFeeds() {
  for (const feed of Object.values(FEEDS)) {
    feed.lastMs = 0;
    setBox(feed.box, 'NO LINK');
    feed.marker.setLive(false);
  }
}

// No line for 3 s while connected -> mark STALE so old numbers don't look live
setInterval(() => {
  if (!(port || wifiLinked)) return;
  for (const feed of Object.values(FEEDS)) {
    if (feed.lastMs && Date.now() - feed.lastMs > 3000) {
      document.getElementById(feed.box + 'State').textContent = 'STALE';
      document.getElementById(feed.box + 'State').style.color = STATE_COLORS.STALE;
      document.getElementById(feed.box + 'Dot').style.background = STATE_COLORS.STALE;
      feed.marker.setLive(false);
    }
  }
}, 1000);

btnConn.onclick = () => (port ? disconnect() : connect());

// ---------- WiFi link (only when the ESP32 serves this page) ----------
// GPS:     GET  api/gps     -> same "GPS,..." line the USB link prints, polled once a second
// Rover:   GET  api/rover   -> same "ROVER,..." line the USB link prints, polled once a second
// Mission: POST api/mission -> same JSON line as USB, reply is the same ACK/ERR text
// api/gps decides whether the link is up. api/rover failing (e.g. 404 on older firmware) is just ignored.
let wifiLinked = false;
let gpsPollBusy = false;
let roverPollBusy = false;

async function pollWifiRover() {
  if (roverPollBusy || !wifiLinked) return;
  roverPollBusy = true;
  try {
    const r = await fetch('api/rover', { cache: 'no-store', signal: AbortSignal.timeout(2500) });
    if (r.ok) {
      const text = (await r.text()).trim();
      if (text.startsWith('ROVER,')) handleEspLine(text);
    }
  } catch (e) {
    // link loss is reported by pollWifiGps
  } finally {
    roverPollBusy = false;
  }
}

async function pollWifiGps() {
  if (gpsPollBusy) return;   // previous request still waiting, don't pile up
  gpsPollBusy = true;
  try {
    const r = await fetch('api/gps', { cache: 'no-store', signal: AbortSignal.timeout(2500) });
    const text = (await r.text()).trim();
    if (!wifiLinked) { wifiLinked = true; setConnected(true); logLine('--- WiFi link up ---'); }
    handleEspLine(text);
  } catch (e) {
    if (wifiLinked) {
      wifiLinked = false;
      setConnected(false);
      resetFeeds();
      logLine('--- WiFi link lost ---');
    }
  } finally {
    gpsPollBusy = false;
  }
}

if (WIFI) {
  document.getElementById('bsTitle').textContent = 'Base station (WiFi)';
  // The button only shows link state in WiFi mode, there is nothing to connect manually
  setConnected = on => {
    btnConn.textContent = on ? 'Linked to base station' : 'No link (join the BaseStation WiFi)';
    btnConn.classList.toggle('connected', on);
  };
  btnConn.onclick = null;
  btnConn.disabled = true;
  setConnected(false);
  pollWifiGps();
  setInterval(pollWifiGps, 1000);
  setInterval(pollWifiRover, 1000);
}

document.getElementById('btnSend').onclick = async () => {
  const data = exportData();
  if (!data.waypoints.length) { alert('No waypoints to send.'); return; }
  const line = JSON.stringify(data) + '\n';  // compact, one line. Newline = end of message

  if (WIFI) {
    try {
      const r = await fetch('api/mission', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: line, signal: AbortSignal.timeout(5000) });
      logLine(`SENT: ${data.waypoints.length} waypoint(s), ${data.boundary.length} boundary pt(s), ${line.length} bytes`);
      (await r.text()).split('\n').filter(Boolean).forEach(handleEspLine);   // ACK/ERR lines -> log
    } catch (e) {
      logLine('--- send failed: ' + e.message + ' ---');
    }
    return;
  }

  if (!writer) { alert('Connect to the base station first.'); return; }
  await writer.write(new TextEncoder().encode(line));
  logLine(`SENT: ${data.waypoints.length} waypoint(s), ${data.boundary.length} boundary pt(s), ${line.length} bytes`);
};

// USB cable unplugged
if ('serial' in navigator) {
  navigator.serial.addEventListener('disconnect', e => { if (e.target === port) disconnect(); });
}

redraw();
// No locate() on startup: laptops usually need internet for location. Map starts on FIELD_CENTER instead.
</script>
</body>
